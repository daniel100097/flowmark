# Push a tag like v0.1.0 to publish a GitHub Release with the binaries and the web app.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

  binaries:
    needs: create
    uses: ./.github/workflows/build.yml
    with:
      release-tag: ${{ github.ref_name }}

  web:
    needs: create
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (rust-toolchain.toml) and wasm target
        run: |
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build and upload the web app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/build-web.sh
          (cd web/dist && zip -qr ../../flowmark-web.zip .)
          gh release upload "$GITHUB_REF_NAME" flowmark-web.zip --clobber --repo "$GITHUB_REPOSITORY"

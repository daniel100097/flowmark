[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
flowmark_parser = { path = "crates/flowmark_parser" }
# tsrs is not on crates.io; pin the release tag.
tsrs_ast = { git = "https://github.com/oxc-project/tsrs", tag = "v0.23.0" }
tsrs_core = { git = "https://github.com/oxc-project/tsrs", tag = "v0.23.0" }
tsrs_parser = { git = "https://github.com/oxc-project/tsrs", tag = "v0.23.0" }
tsrs_scanner = { git = "https://github.com/oxc-project/tsrs", tag = "v0.23.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3"

# Small WebAssembly: cargo build -p flowmark_wasm --target wasm32-unknown-unknown --profile wasm
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
